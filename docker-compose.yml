# Levanta los tres servicios de DataShield + ClamAV.
#
# Uso rápido:
#   docker compose up -d
#
# Primer arranque: ClamAV tarda ~3 min mientras freshclam descarga firmas.
# Estado:   docker compose ps
# Logs:     docker compose logs -f backend
#
# Variables de entorno del backend: copiar backend/.env.example → backend/.env
# y completar los valores reales antes de levantar.
#
# Los puertos solo se exponen en localhost (127.0.0.1): Nginx (el proxy real
# en producción) es el único que debe recibir tráfico externo.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Hallazgo A10: URL pública inyectada durante la compilación del frontend
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: datashield-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datashield-backend
    env_file:
      - backend/.env
    # Hallazgo A09: Persistencia declarada de almacenamiento, cuarentena y logs
    volumes:
      - datashield-storage:/app/storage
      - datashield-quarantine:/app/quarantine
      - datashield-logs:/app/logs
    environment:
      # El backend necesita conocer la IP del proxy de confianza: Nginx/el
      # propio compose llega al backend desde la red interna de Docker.
      TRUST_PROXY: 'true'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    container_name: datashield-clamav
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      # Persiste las firmas de virus entre reinicios para no volver a
      # descargarlas desde cero en cada arranque del contenedor.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

volumes:
  clamav-db:
  datashield-storage:
  datashield-quarantine:
  datashield-logs:
